name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 is not set; the APK uses a throwaway debug key and won't install over a previous build."
          fi

      - name: Build APK
        env:
          RELAY_URL: ${{ vars.RELAY_URL }}
          SCREEN_URL: ${{ vars.SCREEN_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          gradle -p android :app:assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk tesla-waze.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tesla-waze-apk
          path: tesla-waze.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: tesla-waze.apk
