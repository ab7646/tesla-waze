# The worker name is the first part of the address: car.<subdomain>.workers.dev
name = "car"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
